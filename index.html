<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermanos Herrarte · Galería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0908;
            color: #ece6df;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        /* === HERO === */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0 1.5rem 0;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(212, 163, 115, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f5e6d3 0%, #d4a373 60%, #b8865a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            margin-bottom: 0.3rem;
            text-shadow: 0 0 40px rgba(212, 163, 115, 0.1);
        }

        .hero p {
            color: #a89a8c;
            font-weight: 300;
            letter-spacing: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-top: 1px solid rgba(212, 163, 115, 0.15);
            padding-top: 0.6rem;
            display: inline-block;
        }

        /* === GALERÍA (imágenes grandes y completas) === */
        .galeria {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2.5rem;
            margin-top: 1rem;
        }

        .galeria .img-wrapper {
            background: #1a1512;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 25px 50px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(212, 163, 115, 0.08);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .galeria .img-wrapper:hover {
            transform: scale(1.03) translateY(-8px);
            box-shadow: 0 40px 70px -15px rgba(0, 0, 0, 0.95), 0 0 0 2px rgba(212, 163, 115, 0.3);
        }

        .galeria img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 24px;
            object-fit: none;
            background: #0b0908;
            transition: transform 0.5s ease;
        }

        .galeria .img-wrapper:hover img {
            transform: scale(1.02);
        }

        /* === RESPONSIVE === */
        @media (max-width: 800px) {
            .galeria {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .hero h1 {
                font-size: 3rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0.8rem;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
            .hero p {
                font-size: 0.7rem;
                letter-spacing: 5px;
            }
            .galeria .img-wrapper {
                border-radius: 24px;
                padding: 0.3rem;
            }
            .galeria img {
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ENCABEZADO -->
    <div class="hero">
        <h1>Hermanos Herrarte</h1>
        <p>✦ Cocina de autor ✦</p>
    </div>

    <!-- GALERÍA DE IMÁGENES (SOLO FOTOS) -->
    <div class="galeria">
        <div class="img-wrapper">
            <img src="IMG-20260907-WA0004.jpg" alt="Foto 1" />
        </div>
        <div class="img-wrapper">
            <img src="IMG-20260907-WA0005.jpg" alt="Foto 2" />
        </div>
    </div>

</div>
</body>
</html>
