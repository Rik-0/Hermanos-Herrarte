<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermanos Herrarte</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0908;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Inter', sans-serif;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            text-align: center;
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f5e6d3, #d4a373, #b8865a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-shadow: 0 0 60px rgba(212,163,115,0.2);
            margin-bottom: 0.2rem;
        }
        .hero p {
            color: #a89a8c;
            font-weight: 300;
            letter-spacing: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-top: 2px solid rgba(212,163,115,0.15);
            display: inline-block;
            padding-top: 10px;
        }
        .galeria {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }
        .galeria img {
            width: 100%;
            height: auto;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.9), 0 0 0 1px rgba(212,163,115,0.1);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            background: #1a1512;
            padding: 6px;
        }
        .galeria img:hover {
            transform: scale(1.03) translateY(-6px);
            box-shadow: 0 35px 60px -10px rgba(0,0,0,0.95), 0 0 0 2px rgba(212,163,115,0.25);
        }
        @media (max-width: 700px) {
            .hero h1 { font-size: 2.8rem; }
            .galeria { grid-template-columns: 1fr; gap: 20px; }
        }
        @media (max-width: 480px) {
            .hero h1 { font-size: 2.2rem; }
            .hero p { font-size: 0.7rem; letter-spacing: 5px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>Hermanos Herrarte</h1>
        <p>✦ Cocina ✦</p>
    </div>
    <div class="galeria">
        <img src="IMG-20260910-WA0020.jpg" alt="Menú 1">
        <img src="IMG-20260910-WA0021.jpg" alt="Menú 2">
    </div>
</div>
</body>
</html>
